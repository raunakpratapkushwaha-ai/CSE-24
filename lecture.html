<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="./response.html" name="Raunak" target="_blank" method="get">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="password" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="email" required><br><br>

        <label type="tel" id="phone" > Telephone</label>
        <input type="number" value="phone" placeholder="1234 -1234 -1234"> <br><br>
        
        <label for="date">DOB:</label>
        <input type="date" id="date" name="date"><br><br>

        <label for="address" > Address
            <textarea name="address" id="address" cols="30" rows="10" placeholder="Enter your address here"></textarea>
        </label> <br><br>

        <label for="gender"> gender </label>
        <input type="radio" name="gender" id="male" value="male"> Male
        <input type="radio" name="gender" id="female" value="female"> female <br> <br>

        <input type="checkbox"> have a bike
        <input type="checkbox"> have a car <br> <br>
    
        <input type="submit" value="Submit">
        <input type="reset" value="Reset"><br> <br>
    </form>
</body>
</html>
